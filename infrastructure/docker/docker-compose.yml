services:
  postgres:
    image: postgres:16-alpine
    container_name: ef-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ef_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ef_password}
      POSTGRES_DB: ${POSTGRES_DB:-ef_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ef_user} -d ${POSTGRES_DB:-ef_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api-gateway
    container_name: ef-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_GATEWAY_PORT: 3000
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      USERS_SERVICE_HOST: users-service
      USERS_SERVICE_PORT: 3002
      VENUES_SERVICE_HOST: venues-service
      VENUES_SERVICE_PORT: 3003
    depends_on:
      auth-service:
        condition: service_started
      users-service:
        condition: service_started
      venues-service:
        condition: service_started

  auth-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.auth-service
    container_name: ef-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      AUTH_SERVICE_HOST: 0.0.0.0
      AUTH_SERVICE_PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ef_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ef_password}
      POSTGRES_DB: ${POSTGRES_DB:-ef_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ef_user}:${POSTGRES_PASSWORD:-ef_password}@postgres:5432/${POSTGRES_DB:-ef_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-ef-dev-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy

  users-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.users-service
    container_name: ef-users-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      USERS_SERVICE_HOST: 0.0.0.0
      USERS_SERVICE_PORT: 3002
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ef_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ef_password}
      POSTGRES_DB: ${POSTGRES_DB:-ef_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ef_user}:${POSTGRES_PASSWORD:-ef_password}@postgres:5432/${POSTGRES_DB:-ef_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  venues-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.venues-service
    container_name: ef-venues-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VENUES_SERVICE_HOST: 0.0.0.0
      VENUES_SERVICE_PORT: 3003
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ef_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ef_password}
      POSTGRES_DB: ${POSTGRES_DB:-ef_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ef_user}:${POSTGRES_PASSWORD:-ef_password}@postgres:5432/${POSTGRES_DB:-ef_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
