<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141019"/>
      <stop offset="50%" stop-color="#1d1409"/>
      <stop offset="100%" stop-color="#241204"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="72%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff8c00" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ff8c00" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmber" cx="12%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#ff5f00" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff5f00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="28%" cy="10%" r="35%">
      <stop offset="0%" stop-color="#00cec8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00cec8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam2" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ff8c00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- glows: naranja dominante, brasa abajo-izquierda, eco esmeralda arriba -->
  <rect width="1920" height="1080" fill="url(#glowOrange)"/>
  <rect width="1920" height="1080" fill="url(#glowEmber)"/>
  <rect width="1920" height="1080" fill="url(#glowTeal)"/>

  <!-- beams de luz diagonales -->
  <polygon points="1080,0 1330,0 680,1080 460,1080" fill="url(#beam)"/>
  <polygon points="1500,0 1620,0 1080,1080 980,1080" fill="url(#beam2)"/>

  <!-- piso: grid en perspectiva hacia el punto de fuga (1250, 640) -->
  <g stroke="#ff8c00">
    <path d="M-250 1080 L1250 640" stroke-opacity="0.20" stroke-width="1.5"/>
    <path d="M120 1080 L1250 640" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M480 1080 L1250 640" stroke-opacity="0.17" stroke-width="1.5"/>
    <path d="M840 1080 L1250 640" stroke-opacity="0.17" stroke-width="1.5"/>
    <path d="M1200 1080 L1250 640" stroke-opacity="0.17" stroke-width="1.5"/>
    <path d="M1560 1080 L1250 640" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M1920 1080 L1250 640" stroke-opacity="0.20" stroke-width="1.5"/>
    <path d="M2280 1080 L1250 640" stroke-opacity="0.20" stroke-width="1.5"/>
    <line x1="0" y1="640" x2="1920" y2="640" stroke-opacity="0.28" stroke-width="1"/>
    <line x1="0" y1="668" x2="1920" y2="668" stroke-opacity="0.10" stroke-width="1"/>
    <line x1="0" y1="706" x2="1920" y2="706" stroke-opacity="0.10" stroke-width="1"/>
    <line x1="0" y1="758" x2="1920" y2="758" stroke-opacity="0.09" stroke-width="1.5"/>
    <line x1="0" y1="828" x2="1920" y2="828" stroke-opacity="0.09" stroke-width="1.5"/>
    <line x1="0" y1="920" x2="1920" y2="920" stroke-opacity="0.08" stroke-width="2"/>
    <line x1="0" y1="1035" x2="1920" y2="1035" stroke-opacity="0.08" stroke-width="2"/>
  </g>

  <!-- anillos HUD alrededor del foco naranja -->
  <g fill="none">
    <circle cx="1400" cy="410" r="170" stroke="#ffb347" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 14"/>
    <circle cx="1400" cy="410" r="250" stroke="#ff8c00" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="1400" cy="410" r="340" stroke="#ff8c00" stroke-opacity="0.09" stroke-width="1.5" stroke-dasharray="2 10"/>
    <path d="M1400 190 A220 220 0 0 1 1618 430" stroke="#ffb347" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M1188 470 A220 220 0 0 1 1260 240" stroke="#00cec8" stroke-opacity="0.35" stroke-width="3"/>
  </g>

  <!-- hexágonos técnicos -->
  <g stroke="#ff8c00" fill="none">
    <path d="M1660 170 l30 17 v34 l-30 17 -30 -17 v-34 z" stroke-opacity="0.30" stroke-width="1.5"/>
    <path d="M1730 640 l22 13 v26 l-22 13 -22 -13 v-26 z" stroke-opacity="0.20" stroke-width="1.5"/>
    <path d="M1120 150 l18 10 v21 l-18 10 -18 -10 v-21 z" stroke-opacity="0.16" stroke-width="1.5"/>
  </g>

  <!-- partículas -->
  <g>
    <circle cx="1480" cy="290" r="6" fill="#ffb347" fill-opacity="0.65"/>
    <circle cx="1540" cy="520" r="8" fill="#ff8c00" fill-opacity="0.45"/>
    <circle cx="1310" cy="620" r="5" fill="#ff8c00" fill-opacity="0.5"/>
    <circle cx="1690" cy="380" r="4" fill="#ffb347" fill-opacity="0.55"/>
    <circle cx="1230" cy="330" r="4" fill="#00cec8" fill-opacity="0.45"/>
    <circle cx="1600" cy="760" r="6" fill="#ff8c00" fill-opacity="0.30"/>
    <circle cx="960" cy="220" r="3" fill="#ffb347" fill-opacity="0.35"/>
    <circle cx="820" cy="840" r="5" fill="#ff8c00" fill-opacity="0.28"/>
    <circle cx="360" cy="950" r="4" fill="#ff5f00" fill-opacity="0.4"/>
    <circle cx="180" cy="640" r="3" fill="#ffb347" fill-opacity="0.3"/>
  </g>

  <!-- scanlines sutiles -->
  <g stroke="#ffb347">
    <line x1="0" y1="180" x2="1920" y2="180" stroke-opacity="0.05" stroke-width="1"/>
    <line x1="0" y1="365" x2="1920" y2="365" stroke-opacity="0.04" stroke-width="1"/>
    <line x1="0" y1="530" x2="1920" y2="530" stroke-opacity="0.05" stroke-width="1"/>
  </g>
</svg>
